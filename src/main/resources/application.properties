# === BASE DE DONNÉES H2 (fichier persistant) ===
# jdbc:h2:file:./data/devisdb  => fichier dans le répertoire courant
spring.datasource.url=jdbc:h2:file:./data/devisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA / HIBERNATE ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update : crée ou met à jour les tables au démarrage sans supprimer les données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# === CONSOLE H2 (accessible sur /h2-console pour inspecter les données) ===
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

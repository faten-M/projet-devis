# === BASE DE DONNÉES H2 (fichier persistant) ===
# jdbc:h2:file:./data/devisdb  => fichier dans le répertoire courant
spring.datasource.url=jdbc:h2:file:./data/devisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA / HIBERNATE ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update : crée ou met à jour les tables au démarrage sans supprimer les données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# === CONSOLE H2 (désactivée par défaut — activée via le profil dev) ===
spring.h2.console.enabled=false

# === GESTION DES ERREURS (affiche le message d'erreur dans la réponse JSON) ===
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

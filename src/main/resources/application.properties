# === BASE DE DONNÉES H2 (fichier persistant) ===
# jdbc:h2:file:./data/devisdb  => fichier dans le répertoire courant
spring.datasource.url=jdbc:h2:file:./data/devisdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA / HIBERNATE ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update : crée ou met à jour les tables au démarrage sans supprimer les données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# === CONSOLE H2 (désactivée par défaut — activée via le profil dev) ===
spring.h2.console.enabled=true

# === GESTION DES ERREURS (affiche le message d'erreur dans la réponse JSON) ===
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# === LECTURE EMAIL AUTOMATIQUE (Phase 4) ===
# Identifiants lus depuis des variables d'environnement (jamais en clair ici, jamais commités).
# Pour activer : définir EMAIL_IMAP_ENABLED=true, EMAIL_IMAP_USERNAME et EMAIL_IMAP_PASSWORD
# (mot de passe d'application Gmail, pas le mot de passe du compte) avant de lancer l'application.
email.imap.enabled=${EMAIL_IMAP_ENABLED:false}
email.imap.host=imap.gmail.com
email.imap.port=993
email.imap.username=${EMAIL_IMAP_USERNAME:}
email.imap.password=${EMAIL_IMAP_PASSWORD:}

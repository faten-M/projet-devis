# === PROFIL DEV — configuration spécifique au développement local ===
# Activer avec : -Dspring.profiles.active=dev  (ou dans la config de lancement IntelliJ/VS Code)

# Console H2 activée uniquement en développement
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL visible en développement pour faciliter le débogage
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
